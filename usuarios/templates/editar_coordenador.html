{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center;">Editar Informações do Coordenador</h2>

</form>

<p style="text-align:center;margin-top:10px;">
    <a href="{% url 'usuarios:coordenacao' %}">Voltar</a>
</p>

{% endblock %}
