{% extends "base.html" %}
{% block content %}

<h1 style="text-align: center;">Cadastrar Advertência</h1>

{% if messages %}
    <ul style="list-style: none; text-align: center; padding: 0;">
        {% for message in messages %}
        <li style="color: {% if message.tags == 'error' %}red{% else %}green{% endif %}; font-weight: bold;">
            {{ message }}
        </li>
        {% endfor %}
    </ul>
{% endif %}

<form method="POST" style="max-width:600px; margin: 0 auto;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar Advertência</button>
</form>

<p style="text-align:center;">
    <a href="{{ request.META.HTTP_REFERER|default:'/'  }}">Voltar</a>
</p>

{% endblock %}
