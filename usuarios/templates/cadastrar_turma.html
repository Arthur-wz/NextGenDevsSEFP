{% extends "base.html" %}
{% block content %}

<h1 style="text-align: center;">Cadastrar Turma</h1>

{% if messages %}
    <ul style="list-style: none; text-align: center; padding: 0;">
        {% for message in messages %}
        <li style="color: {% if message.tags == 'error' %}red{% else %}green{% endif %}; font-weight: bold;">
            {{ message }}
        </li>
        {% endfor %}
    </ul>
{% endif %}

<form method="POST" style="max-width:600px; margin: 0 auto;">
    {% csrf_token %}
    {{ form.as_p }}

    <button 
        type="submit"
        style="background:#1e3a8a; color:white; padding:10px 18px; border:none; border-radius:6px; cursor:pointer; font-weight:bold;"
    >
        Salvar Turma
    </button>
</form>

<p style="text-align:center; margin-top:15px;">
    <a href="{{ request.META.HTTP_REFERER|default:'/usuarios/coordenacao/' }}">
        Voltar
    </a>
</p>

{% endblock %}
