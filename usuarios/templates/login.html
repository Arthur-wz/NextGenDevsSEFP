{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SEFP — Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)),
                url("{% static 'admin/img/escola.png' %}");

            background-repeat: no-repeat;
            background-position: center;
            background-size: 108%;

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            text-align: center;

            background: rgba(255, 255, 255, 0.75);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #5dbde6;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1b6a8c;
        }

        .error-box {
            background: #ffdede;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2>SEFP — Login</h2>

    <form method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="error-box">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <label>Usuário</label>
        {{ form.username }}

        <label>Senha</label>
        {{ form.password }}

        <button type="submit" class="submit-btn">Entrar</button>
    </form>
</div>

</body>
</html>
